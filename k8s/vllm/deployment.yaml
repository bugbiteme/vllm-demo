apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhaiis-granite
  labels:
    app: rhaiis-granite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rhaiis-granite
  template:
    metadata:
      labels:
        app: rhaiis-granite
    spec:
      # Only needed if you are pulling from a private registry
      # imagePullSecrets:
      #   - name: redhat-registry-secret
      containers:
        - name: vllm
          image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.0
          args:
            - "--model"
            - "ibm-granite/granite-4.2-8b"
            - "--tensor-parallel-size"
            - "1"
            # Granite 4.2's default 131072 context needs 20GiB KV cache;
            # a single L4 (24GiB) only has ~3GiB left after model weights (16.4GiB).
            - "--max-model-len"
            - "16384"
          env:
            - name: HF_HUB_OFFLINE
              value: "0"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: cache
              mountPath: /opt/app-root/src/.cache
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 60
            periodSeconds: 10
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rhaiis-granite
spec:
  selector:
    app: rhaiis-granite
  ports:
    - port: 8000
      targetPort: 8000