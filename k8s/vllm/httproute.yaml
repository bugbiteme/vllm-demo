apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rhaiis-granite
  namespace: rhaiis-demo
spec:
  parentRefs:
    - name: maas-gateway
      namespace: maas-gateway
  rules:
    - matches:
        - headers:
            - name: x-model-name
              value: granite-4.2-8b
      backendRefs:
        - name: rhaiis-granite
          port: 8000