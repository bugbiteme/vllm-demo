apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: rhaiis-demo
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            - name: OPENAI_API_BASE_URL
              value: "http://ogx-svc:8321/v1"
            - name: OPENAI_API_KEY
              value: "none"   # OGX has no auth configured yet; any non-empty string satisfies Open WebUI's client
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: WEBUI_SECRET_KEY
              value: "change-me-to-a-real-random-value"
            - name: DEFAULT_MODELS
              value: "vllm/ibm-granite/granite-4.2-8b-fp8"
            - name: WEBUI_AUTH
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: rhaiis-demo
spec:
  selector:
    app: open-webui
  ports:
    - port: 8080
      targetPort: 8080